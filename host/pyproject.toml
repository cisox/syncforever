[project]
name = "syncforever"
version = "0.1.0"
description = "Sync Forever: EverDrive USB file sync (host side)"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.23",
    "pyserial>=3.5",
]

[project.scripts]
syncforever = "syncforever.cli:main"
sfe = "syncforever.cli:main"

[dependency-groups]
dev = [
    "machine68k>=0.4.1",
    "py65>=1.2.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# data/ holds the packaged app ROMs; sync-forever.md is a Genesis ROM, not Markdown.
extend-exclude = ["src/syncforever/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a real N8 PRO on USB (run with --hardware)"]
