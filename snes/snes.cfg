# Sync Forever (SNES app): LoROM, one 32 KiB bank at $00:8000, 2 KiB SRAM at $70:0000.
# cc65's 6502 code runs with the 65816 in emulation mode (crt0.s): direct page 0, stack in
# page 1, data bank 0. WRAM $0000-$1FFF is bank 0's low RAM.

MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, define = yes;
    # $0100 CPU stack, $0200-$17FF data/bss (the tilemap copy is 2 KiB),
    # $1800-$1FFF cc65 parameter stack (crt0 points sp at $2000).
    RAM:   start = $0200, size = $1600, define = yes;
    ROM:   start = $8000, size = $7000, type = ro, file = %O, fill = yes, fillval = $FF;
    # The box writes here over USB (docs/snes-plan.md, link.c): the box -> app ring.
    INBOX: start = $F000, size = $0FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HDR:   start = $FFC0, size = $0040, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    STARTUP:  load = ROM,   type = ro, define = yes;
    LOWCODE:  load = ROM,   type = ro, optional = yes;
    ONCE:     load = ROM,   type = ro, optional = yes;
    INIT:     load = ROM,   type = ro, define = yes, optional = yes;
    CODE:     load = ROM,   type = ro, define = yes;
    RODATA:   load = ROM,   type = ro, define = yes;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,   type = bss, define = yes;
    HEAP:     load = RAM,   type = bss, optional = yes;
    HEADER:   load = HDR,   type = ro, start = $FFC0;
    VECTORS:  load = HDR,   type = ro, start = $FFE0;
}

FEATURES {
    CONDES: segment = INIT,   type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA, type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__;
    CONDES: segment = RODATA, type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__;
}
