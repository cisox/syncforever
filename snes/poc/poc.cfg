# LoROM, one 32 KiB bank at $8000.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw;
    ROM: start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = ROM, type = ro, start = $8000;
    RODATA:   load = ROM, type = ro;
    INBOX:    load = ROM, type = ro, start = $F000;
    HEADER:   load = ROM, type = ro, start = $FFC0;
    VECTORS:  load = ROM, type = ro, start = $FFE0;
}
