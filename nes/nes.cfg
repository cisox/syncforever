# Sync Forever: NROM-256 (mapper 0), 32 KB PRG + 8 KB CHR ROM.
# Layout follows Krikzz's edio sample (MIT), trimmed to one CHR bank.

MEMORY {
    # $00-$27 belong to the cc65 runtime (sp, ptr1.., tmp1..).
    ZP:      start = $28,   size = $d8,   type = rw, define = yes;
    HEADER:  start = $0,    size = $10,   file = %O, fill = yes;
    PRG:     start = $8000, size = $7ffa, file = %O, fill = yes, define = yes;
    VECTORS: start = $fffa, size = $6,    file = %O, fill = yes;
    CHR:     start = $0,    size = $2000, file = %O, fill = yes;
    # $0100 CPU stack, $0200-$05ff data/bss (no sprites, so no OAM page),
    # $0600-$07ff cc65 parameter stack (crt0 points sp at $0800).
    RAM:     start = $0200, size = $0400, define = yes;
}

SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    STARTUP:  load = PRG,     type = ro,  define = yes;
    LOWCODE:  load = PRG,     type = ro,  optional = yes;
    ONCE:     load = PRG,     type = ro,  optional = yes;
    INIT:     load = PRG,     type = ro,  define = yes, optional = yes;
    CODE:     load = PRG,     type = ro,  define = yes;
    RODATA:   load = PRG,     type = ro,  define = yes;
    DATA:     load = PRG, run = RAM, type = rw, define = yes;
    VECTORS:  load = VECTORS, type = ro;
    CHARS:    load = CHR,     type = ro;
    BSS:      load = RAM,     type = bss, define = yes;
    HEAP:     load = RAM,     type = bss, optional = yes;
    ZEROPAGE: load = ZP,      type = zp;
}

FEATURES {
    CONDES: segment = INIT,   type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA, type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__;
    CONDES: segment = RODATA, type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__;
}
